name: Build Windows

# Pokreće se ručno (Actions → Build Windows → Run workflow).
# Rezultat je NACRT (draft) izdanja u "Releases" sa .exe, .msi i, ako su podešeni ključevi, latest.json za automatsko ažuriranje.
# Nacrt pregledaš, upišeš izmjene i klikneš "Publish release".

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test

      # Podešavanje automatskog ažuriranja (samo ako je postavljena varijabla TAURI_UPDATER_PUBKEY)
      - name: Updater config
        if: ${{ vars.TAURI_UPDATER_PUBKEY != '' }}
        shell: pwsh
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: |
          $cfg = @{
            bundle  = @{ createUpdaterArtifacts = $true }
            plugins = @{ updater = @{ pubkey = $env:PUBKEY; endpoints = @($env:ENDPOINT); windows = @{ installMode = 'passive' } } }
          }
          $cfg | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 src-tauri/updater.conf.json

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Electoral & Party System Indices v__VERSION__'
          releaseBody: Ovdje upiši izmjene prije objavljivanja.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ vars.TAURI_UPDATER_PUBKEY != '' && format('--config {0}/src-tauri/updater.conf.json', github.workspace) || '' }}
