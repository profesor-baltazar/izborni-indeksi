<!DOCTYPE html>
<html lang="sr-Latn-ME">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Electoral &amp; Party System Indices</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="topbar">
    <img class="logo" src="assets/icon.png" alt="" aria-hidden="true" />
    <div class="brand-title" data-i18n="Indeksi izbornih i stranačkih sistema">Electoral &amp; Party System Indices</div>
    <span class="app-version" id="app-version"></span>
    <div class="spacer"></div>
    <select id="lang-select" class="theme-select lang-select" data-i18n-title="Jezik" title="Jezik">
      <option value="en" title="English">EN</option>
      <option value="me" title="Crnogorski">ME</option>
    </select>
    <select id="theme-select" class="theme-select" data-i18n-title="Tema" title="Tema">
      <option value="system" data-i18n="◐ Sistemska">◐ Sistemska</option>
      <option value="light" data-i18n="☀ Svijetla">☀ Svijetla</option>
      <option value="dark" data-i18n="☾ Tamna">☾ Tamna</option>
    </select>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <div class="side-label" data-i18n="Moduli">Moduli</div>
      <div class="nav" id="module-nav">
        <a data-mod="results" class="on" data-i18n="Rezultati">Rezultati</a>
        <a data-mod="indices" data-i18n="Indeksi">Indeksi</a>
        <a data-mod="alloc" data-i18n="Raspodjela mandata">Raspodjela mandata</a>
        <a data-mod="nat" data-i18n="Nacionalizacija stranaka">Nacionalizacija stranaka</a>
        <a data-mod="vol" data-i18n="Volatilnost">Volatilnost</a>
        <a data-mod="compare" data-i18n="Poređenje">Poređenje</a>
      </div>
      <div class="side-label" data-i18n="Države i izbori">Države i izbori</div>
      <div class="nav" id="election-nav"></div>
      <button class="btn small full" id="new-country" data-i18n="+ Nova država">+ Nova država</button>
      <div class="side-foot">
        <button class="btn small full ghost" id="backup-btn" data-i18n="Rezervna kopija (JSON)">Rezervna kopija (JSON)</button>
        <button class="btn small full ghost" id="restore-btn" data-i18n="Vrati iz kopije">Vrati iz kopije</button>
        <button class="btn small full ghost" id="import-pkg-btn" data-i18n="Uvezi državu ili izbore">Uvezi državu ili izbore</button>
        <button class="btn small full ghost" id="import-parlgov-btn" data-i18n="Uvezi iz ParlGov baze">Uvezi iz ParlGov baze</button>
      </div>
    </nav>

    <main id="main"></main>
  </div>

  <footer class="exportbar no-print">
    <span class="muted" data-i18n="Izvoz">Izvoz</span>
    <button class="btn small" id="exp-csv" data-i18n="CSV (ovaj modul)">CSV (ovaj modul)</button>
    <button class="btn small" id="exp-xlsx" data-i18n="Excel (svi moduli)">Excel (svi moduli)</button>
    <button class="btn small" id="exp-pdf" data-i18n="PDF / štampa">PDF / štampa</button>
  </footer>

  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>

  <script src="vendor/exceljs.min.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/compute.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
