<!DOCTYPE html>
<html lang="sr-Latn-ME">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Izborni indeksi</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="6" width="4" height="15" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg></div>
    <div class="brand-title">Izborni indeksi</div>
    <div class="spacer"></div>
    <select id="theme-select" class="theme-select" title="Tema">
      <option value="system">Tema: kao sistem</option>
      <option value="light">Tema: svijetla</option>
      <option value="dark">Tema: tamna</option>
    </select>
    <button id="drive-btn" class="btn">Google Drive</button>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <div class="side-label">Moduli</div>
      <div class="nav" id="module-nav">
        <a data-mod="results" class="on">Rezultati i indeksi</a>
        <a data-mod="alloc">Raspodjela mandata</a>
        <a data-mod="nat">Nacionalizacija stranaka</a>
        <a data-mod="vol">Volatilnost</a>
      </div>
      <div class="side-label">Izbori</div>
      <div class="nav" id="election-nav"></div>
      <button class="btn small full" id="new-election">+ Novi izbori</button>
      <div class="side-foot">
        <button class="btn small full ghost" id="backup-btn">Rezervna kopija (JSON)</button>
        <button class="btn small full ghost" id="restore-btn">Vrati iz kopije</button>
      </div>
    </nav>

    <main id="main"></main>
  </div>

  <footer class="exportbar no-print">
    <span class="muted">Izvoz</span>
    <button class="btn small" id="exp-csv">CSV (ovaj modul)</button>
    <button class="btn small" id="exp-xlsx">Excel (svi moduli)</button>
    <button class="btn small" id="exp-pdf">PDF / štampa</button>
    <div class="spacer"></div>
    <button class="btn small primary" id="exp-drive">Pošalji Excel na Google Drive</button>
  </footer>

  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>

  <script src="vendor/exceljs.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/compute.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
