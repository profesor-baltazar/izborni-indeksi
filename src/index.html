<!DOCTYPE html>
<html lang="sr-Latn-ME">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Izborni indeksi</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="topbar">
    <img class="logo" src="assets/icon.png" alt="" aria-hidden="true" />
    <div class="brand-title" data-i18n="Izborni indeksi">Izborni indeksi</div>
    <div class="spacer"></div>
    <select id="lang-select" class="theme-select" data-i18n-title="Jezik" title="Jezik">
      <option value="me">Crnogorski</option>
      <option value="en">English</option>
    </select>
    <select id="theme-select" class="theme-select" data-i18n-title="Tema" title="Tema">
      <option value="system" data-i18n="Tema: kao sistem">Tema: kao sistem</option>
      <option value="light" data-i18n="Tema: svijetla">Tema: svijetla</option>
      <option value="dark" data-i18n="Tema: tamna">Tema: tamna</option>
    </select>
    <button id="drive-btn" class="btn">Google Drive</button>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <div class="side-label" data-i18n="Moduli">Moduli</div>
      <div class="nav" id="module-nav">
        <a data-mod="results" class="on" data-i18n="Rezultati i indeksi">Rezultati i indeksi</a>
        <a data-mod="alloc" data-i18n="Raspodjela mandata">Raspodjela mandata</a>
        <a data-mod="nat" data-i18n="Nacionalizacija stranaka">Nacionalizacija stranaka</a>
        <a data-mod="vol" data-i18n="Volatilnost">Volatilnost</a>
      </div>
      <div class="side-label" data-i18n="Izbori">Izbori</div>
      <div class="nav" id="election-nav"></div>
      <button class="btn small full" id="new-election" data-i18n="+ Novi izbori">+ Novi izbori</button>
      <div class="side-foot">
        <button class="btn small full ghost" id="backup-btn" data-i18n="Rezervna kopija (JSON)">Rezervna kopija (JSON)</button>
        <button class="btn small full ghost" id="restore-btn" data-i18n="Vrati iz kopije">Vrati iz kopije</button>
      </div>
    </nav>

    <main id="main"></main>
  </div>

  <footer class="exportbar no-print">
    <span class="muted" data-i18n="Izvoz">Izvoz</span>
    <button class="btn small" id="exp-csv" data-i18n="CSV (ovaj modul)">CSV (ovaj modul)</button>
    <button class="btn small" id="exp-xlsx" data-i18n="Excel (svi moduli)">Excel (svi moduli)</button>
    <button class="btn small" id="exp-pdf" data-i18n="PDF / štampa">PDF / štampa</button>
    <div class="spacer"></div>
    <button class="btn small primary" id="exp-drive" data-i18n="Pošalji Excel na Google Drive">Pošalji Excel na Google Drive</button>
  </footer>

  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>

  <script src="vendor/exceljs.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/compute.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
